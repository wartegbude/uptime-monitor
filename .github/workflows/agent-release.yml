# Builds agent binaries + Docker image when you push a tag like v1.0.0.
# install.sh downloads from: https://github.com/<you>/<repo>/releases/latest/download/uptime-agent-linux-<arch>
name: agent-release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Test
        working-directory: agent
        run: go vet ./... && go test ./...
      - name: Build
        working-directory: agent
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ../dist/uptime-agent-linux-$arch .
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ../dist/uptime-agent-linux-armv7 .
          cd ../dist && for f in uptime-agent-linux-*; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with: { files: 'dist/*' }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      # GHCR image names must be lowercase (e.g. user "RezaQA" → ghcr.io/rezaqa/uptime-agent)
      - name: Image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/uptime-agent" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
